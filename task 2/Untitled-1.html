<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .calculator {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 260px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .display {
      background: #000;
      color: #0f0;
      font-size: 24px;
      padding: 15px;
      text-align: right;
      border-radius: 5px;
      margin-bottom: 10px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    .operator {
      background: #ff9500;
      color: white;
    }

    .number {
      background: #333;
      color: white;
    }

    .equal {
      background: #28a745;
      color: white;
      grid-row: span 2;
    }

    .clear {
      background: #dc3545;
      color: white;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div id="display" class="display">0</div>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="deleteLast()">⌫</button>
    <button class="operator" onclick="appendValue('/')">÷</button>
    <button class="operator" onclick="appendValue('*')">×</button>

    <button class="number" onclick="appendValue('7')">7</button>
    <button class="number" onclick="appendValue('8')">8</button>
    <button class="number" onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('-')">−</button>

    <button class="number" onclick="appendValue('4')">4</button>
    <button class="number" onclick="appendValue('5')">5</button>
    <button class="number" onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button class="number" onclick="appendValue('1')">1</button>
    <button class="number" onclick="appendValue('2')">2</button>
    <button class="number" onclick="appendValue('3')">3</button>
    <button class="equal" onclick="calculate()">=</button>
    <br>
    
    <button class="number" onclick="appendValue('0')">0</button>
    <button class="number" onclick="appendValue('.')">.</button>
    
  </div>
</div>

<script>
  let display = document.getElementById("display");

  function appendValue(value) {
    if (display.innerText === "0") {
      display.innerText = value;
    } else {
      display.innerText += value;
    }
  }

  function clearDisplay() {
    display.innerText = "0";
  }

  function deleteLast() {
    if (display.innerText.length === 1) {
      display.innerText = "0";
    } else {
      display.innerText = display.innerText.slice(0, -1);
    }
  }

  function calculate() {
    try {
      display.innerText = eval(display.innerText);
    } catch {
      display.innerText = "Error";
    }
  }

  // Keyboard Support
  document.addEventListener("keydown", function(e) {
    if (!isNaN(e.key) || "+-*/.".includes(e.key)) {
      appendValue(e.key);
    } else if (e.key === "Enter") {
      calculate();
    } else if (e.key === "Backspace") {
      deleteLast();
    } else if (e.key === "Escape") {
      clearDisplay();
    }
  });
</script>

</body>
</html>
